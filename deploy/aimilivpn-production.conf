# AimiliVPN 多协议节点管理系统
# Public HTTPS management gateway.
# Runtime copy: /etc/nginx/conf.d/aimilivpn-production.conf

server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/aimilivpn/tls/fullchain.pem;
    ssl_certificate_key /etc/aimilivpn/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;

    # Manual VPN switching is make-before-break and may take several minutes
    # when a candidate needs full tunnel/egress verification.
    proxy_connect_timeout 15s;
    proxy_send_timeout 900s;
    proxy_read_timeout 900s;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 8443;
        proxy_connect_timeout 15s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }
}
