name: Finalize repository cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ hashFiles('.maintenance/clean.py') != '' && hashFiles('.maintenance/logo.b64') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply cleanup
        run: |
          python3 .maintenance/clean.py
          python3 -m py_compile vpngate_manager.py
          git diff --check

      - name: Verify
        run: |
          ! grep -RInE '八合一|我的邀请入口|My invitation links|referral code|referral links' README.md install.sh vpngate_manager.py
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p = Path("footer-logo-clean.png")
          b = p.read_bytes()
          assert b[:8] == b"\x89PNG\r\n\x1a\n"
          assert b[12:16] == b"IHDR"
          w, h = struct.unpack(">II", b[16:24])
          bit_depth = b[24]
          color_type = b[25]
          assert w > 0 and h > 0 and color_type in (4, 6)
          print("logo", (w, h), "bit_depth", bit_depth, "color_type", color_type, "bytes", len(b))
          PY

      - name: Commit final cleanup
        run: |
          rm -rf .maintenance
          rm -f .github/workflows/finalize-repository-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md VERSION footer-logo-clean.png install.sh vpngate_manager.py
          git add -u
          git commit -m "Finalize repository cleanup" || exit 0
          git push origin HEAD:main
